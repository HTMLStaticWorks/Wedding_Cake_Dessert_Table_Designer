<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF5D8F' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 12v10H4V12'/><path d='M2 7h20v5H2z'/><path d='M12 22V7'/><path d='M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z'/><path d='M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z'/></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Cherish & Co.</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.435.0/dist/umd/lucide.min.js"></script>
</head>
<body class="auth-page">

    <div class="auth-toggles">
        <button class="theme-toggle" aria-label="Toggle Theme">
            <svg data-lucide="moon" class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><path d="M12 3a6 6 0 0 0 9 9 9 0 1 1-9-9Z"/></svg>
            <svg data-lucide="sun" class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <button class="rtl-toggle" aria-label="Toggle Direction">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 8h14M15 4l4 4-4 4"/>
                <path d="M19 16H5M9 20l-4-4 4-4"/>
            </svg>
        </button>
    </div>

    <div class="auth-card" data-animate>
        <a href="index.html" class="logo" style="margin-bottom: 25px; justify-content: center;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px; color: var(--color-primary);">
                <path d="M20 12v10H4V12"/>
                <path d="M2 7h20v5H2z"/>
                <path d="M12 22V7"/>
                <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
                <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
            </svg>
            <span>Cherish & Co.</span>
        </a>
        
        <h2 style="font-family: var(--font-body); font-weight: 700; font-size: 1.5rem;">Join Cherish & Co.</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 25px;">Create your account to manage favor proofs and exclusive sample box orders</p>

        <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-input" placeholder="Jessica" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-input" placeholder="Miller" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" placeholder="jessica@example.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" class="form-input" placeholder="*******" required>
                    <span class="password-toggle">
                        <i data-lucide="eye"></i>
                        <i data-lucide="eye-off" style="display: none;"></i>
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" class="form-input" placeholder="*******" required>
                    <span class="password-toggle">
                        <i data-lucide="eye"></i>
                        <i data-lucide="eye-off" style="display: none;"></i>
                    </span>
                </div>
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                    <input type="checkbox" required> I accept the Terms & Gifting Policy
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Create Client Account</button>
        </form>

        <div class="divider">or continue with</div>

        <div class="social-auth">
            <button class="social-btn btn-google">
                <svg viewBox="0 0 48 48" style="width: 20px; height: 20px;">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
                </svg>
                Continue with Google
            </button>
            <button class="social-btn btn-apple">
                <svg viewBox="0 0 384 512" style="width: 20px; height: 20px; fill: currentColor;">
                    <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-31.4-73.3-114.8-1.7-152.8zM242.4 8.2c-15.3 18.2-26.3 43.1-23.4 68.3 22.3 1.9 47.4-12.7 61.3-30.8 14.4-18.5 25.4-43.8 21.8-67.9-24.3-1.2-48.4 12.8-59.7 30.4z"/>
                </svg>
                Continue with Apple
            </button>
        </div>

        <p style="margin-top: 25px; font-size: 0.9rem; color: var(--text-secondary);">
            Already have an account? <a href="login.html" style="color: var(--color-primary); font-weight: 600;">Sign in</a>
        </p>
    </div>

    <script src="script.js"></script>
    <button class="back-to-top" aria-label="Back to Top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;"><path d="m18 15-6-6-6 6"/></svg></button>
</body>
</html>
